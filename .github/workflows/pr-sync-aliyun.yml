name: Sync plugins to Aliyun Codeup

on:
  pull_request_target:
    paths:
      - "plugins.json"

jobs:
  detect-and-sync:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      #  只检出 BASE 仓库
      # =========================================================
      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================
      # 2️⃣ 读取 PR 与 base 的 plugins.json
      # =========================================================
      - name: Identify changed plugins
        id: changed-plugins
        shell: python
        run: |
          import json
          import subprocess
          import os
          import urllib.request

          pr_repo_full = "${{ github.event.pull_request.head.repo.full_name }}"
          pr_ref = "${{ github.event.pull_request.head.ref }}"
          pr_url = f"https://raw.githubusercontent.com/{pr_repo_full}/{pr_ref}/plugins.json"

          try:
              with urllib.request.urlopen(pr_url) as resp:
                  pr_plugins = json.load(resp)
          except Exception:
              pr_plugins = []
          try:
              result = subprocess.run(
                  ["git", "show", "HEAD:plugins.json"],
                  capture_output=True, text=True, check=True
              )
              base_plugins = json.loads(result.stdout)
          except Exception:
              base_plugins = []
          base_map = {p.get("github_url"): p for p in base_plugins if p.get("github_url")}
          changed = []

          for plugin in pr_plugins:
              github_url = plugin.get("github_url")
              if not github_url:
                  continue
              base_plugin = base_map.get(github_url)
              # 只比对关键字段，避免 json.dumps 完全匹配失败
              if not base_plugin or plugin.get("name") != base_plugin.get("name") or plugin.get("version") != base_plugin.get("version"):
                  repo_name = github_url.rstrip("/").split("/")[-1].removesuffix(".git")
                  changed.append({
                      "name": plugin.get("name", ""),
                      "github_url": github_url,
                      "repo_name": repo_name,
                      "description": plugin.get("description", ""),
                  })

          out = json.dumps(changed, ensure_ascii=False)
          with open("/tmp/changed_plugins.json", "w", encoding="utf-8") as f:
              f.write(out)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"changed_plugins={out}\n")

          if changed:
              print(f"Detected changed plugins: {out}")
          else:
              print("No changed plugins found")

      # =========================================================
      # 3️⃣ 安装依赖
      # =========================================================
      - name: Install Python dependencies
        if: ${{ steps.changed-plugins.outputs.changed_plugins != '' }}
        run: |
          pip install requests

      # =========================================================
      # 4️⃣ 创建阿里云 Codeup 仓库
      # =========================================================
      - name: Create Aliyun repositories
        if: ${{ steps.changed-plugins.outputs.changed_plugins != '' }}
        run: |
          python scripts/sync.py \
            --changed-plugins '${{ steps.changed-plugins.outputs.changed_plugins }}' \
            --org-id '67a361cf556e6cdab537117a' \
            --access-token '${{ secrets.ALIYUN_PERSONAL_ACCESS_TOKEN }}' \
            --namespace-id 1638483 \
            --namespace-path 'zhenxun_plugins' \
            --visibility 'internal'

      # =========================================================
      # 5️⃣ 同步 GitHub → 阿里云 Codeup
      # =========================================================
      - name: Sync code to Aliyun
        if: ${{ steps.changed-plugins.outputs.changed_plugins != '' }}
        run: |
          set -e

          changed_plugins=$(cat /tmp/changed_plugins.json)

          for row in $(echo "$changed_plugins" | jq -r '.[] | @base64'); do
            _jq() {
              echo "$row" | base64 --decode | jq -r "$1"
            }

            repo_name=$(_jq '.repo_name')
            github_url=$(_jq '.github_url')

            echo "🔄 Syncing $repo_name"

            git clone "$github_url" "$repo_name"
            cd "$repo_name"

            git config --global http.postBuffer 524288000
            git config --global core.compression 0

            aliyun_url="https://${{ secrets.ALIYUN_ACCOUNT }}:${{ secrets.ALIYUN_PASSWORD }}@codeup.aliyun.com/67a361cf556e6cdab537117a/zhenxun_plugins/${repo_name}.git"
            git remote add aliyun "$aliyun_url"

            git push --force aliyun HEAD:main || echo "❌ Push failed: $repo_name"

            cd ..
            rm -rf "$repo_name"
          done

      # =========================================================
      # 6️⃣ 更新 base 分支中的 plugins.json
      # =========================================================
      - name: Update plugins.json with ali_url
        if: ${{ steps.changed-plugins.outputs.changed_plugins != '' }}
        shell: python
        run: |
          import json

          with open("/tmp/changed_plugins.json", "r", encoding="utf-8") as f:
              changed = json.load(f)

          # 确保我们使用的是最新的 plugins.json 文件
          import subprocess
          result = subprocess.run(["git", "fetch", "origin"], check=True, capture_output=True)
          result = subprocess.run(["git", "checkout", "HEAD"], check=True, capture_output=True)

          with open("plugins.json", "r", encoding="utf-8") as f:
              plugins = json.load(f)

          updated = False

          for c in changed:
              for p in plugins:
                  if p.get("github_url") == c["github_url"]:
                      p["ali_url"] = f"https://codeup.aliyun.com/67a361cf556e6cdab537117a/zhenxun_plugins/{c['repo_name']}"
                      updated = True

          if updated:
              with open("plugins.json", "w", encoding="utf-8") as f:
                  json.dump(plugins, f, ensure_ascii=False, indent=2)

      # =========================================================
      # 7️⃣ 提交到 base 分支
      # =========================================================
      - name: Commit and push changes
        if: ${{ success() && steps.changed-plugins.outputs.changed_plugins != '' }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add plugins.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync plugin to Aliyun Codeup"
            git push
          fi

 