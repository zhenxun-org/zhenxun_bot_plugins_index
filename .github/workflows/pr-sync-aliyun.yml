name: Sync plugins to Aliyun Codeup

on:
  pull_request_target:
    paths:
      - "plugins.json"

jobs:
  detect-and-sync:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # 1️⃣ 只检出 BASE 仓库
      # =========================================================
      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================
      # 2️⃣ 读取 PR 与 base 的 plugins.json
      # =========================================================
      - name: Identify changed plugins
        id: changed-plugins
        shell: python
        run: |
          import json
          import subprocess
          import os

          pr_sha = os.environ["GITHUB_EVENT_PULL_REQUEST_HEAD_SHA"]
          base_ref = os.environ["GITHUB_EVENT_PULL_REQUEST_BASE_REF"]

          def load_json_from_git(ref, path):
              try:
                  result = subprocess.run(
                      ["git", "show", f"{ref}:{path}"],
                      capture_output=True,
                      text=True,
                      encoding="utf-8",
                      check=True
                  )
                  return json.loads(result.stdout)
              except Exception:
                  return []

          # PR 中的 plugins.json（只读文件）
          pr_plugins = load_json_from_git(pr_sha, "plugins.json")

          # base 分支的 plugins.json
          base_plugins = load_json_from_git(f"origin/{base_ref}", "plugins.json")

          base_map = {p.get("github_url"): p for p in base_plugins if p.get("github_url")}

          changed = []

          for plugin in pr_plugins:
              github_url = plugin.get("github_url")
              if not github_url:
                  continue

              base_plugin = base_map.get(github_url)

              if not base_plugin or json.dumps(plugin, sort_keys=True) != json.dumps(base_plugin, sort_keys=True):
                  repo_name = github_url.rstrip("/").split("/")[-1]
                  if repo_name.endswith(".git"):
                      repo_name = repo_name[:-4]

                  changed.append({
                      "name": plugin.get("name", repo_name),
                      "github_url": github_url,
                      "repo_name": repo_name,
                  })

          if changed:
              data = json.dumps(changed, ensure_ascii=False)
              with open("/tmp/changed_plugins.json", "w", encoding="utf-8") as f:
                  f.write(data)

              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"changed_plugins={data}\n")

              print("Changed plugins:", data)
          else:
              print("No changed plugins found")

      # =========================================================
      # 3️⃣ 安装依赖
      # =========================================================
      - name: Install Python dependencies
        if: ${{ steps.changed-plugins.outputs.changed_plugins != '' }}
        run: |
          pip install requests

      # =========================================================
      # 4️⃣ 创建阿里云 Codeup 仓库
      # =========================================================
      - name: Create Aliyun repositories
        if: ${{ steps.changed-plugins.outputs.changed_plugins != '' }}
        run: |
          python scripts/sync.py \
            --changed-plugins '${{ steps.changed-plugins.outputs.changed_plugins }}' \
            --org-id '67a361cf556e6cdab537117a' \
            --access-token '${{ secrets.ALIYUN_PERSONAL_ACCESS_TOKEN }}' \
            --namespace-id 1638483 \
            --namespace-path 'zhenxun_plugins' \
            --visibility 'internal'

      # =========================================================
      # 5️⃣ 同步 GitHub → 阿里云 Codeup
      # =========================================================
      - name: Sync code to Aliyun
        if: ${{ steps.changed-plugins.outputs.changed_plugins != '' }}
        run: |
          set -e

          changed_plugins=$(cat /tmp/changed_plugins.json)

          for row in $(echo "$changed_plugins" | jq -r '.[] | @base64'); do
            _jq() {
              echo "$row" | base64 --decode | jq -r "$1"
            }

            repo_name=$(_jq '.repo_name')
            github_url=$(_jq '.github_url')

            echo "🔄 Syncing $repo_name"

            git clone "$github_url" "$repo_name"
            cd "$repo_name"

            git config --global http.postBuffer 524288000
            git config --global core.compression 0

            aliyun_url="https://${{ secrets.ALIYUN_ACCOUNT }}:${{ secrets.ALIYUN_PASSWORD }}@codeup.aliyun.com/67a361cf556e6cdab537117a/zhenxun_plugins/${repo_name}.git"
            git remote add aliyun "$aliyun_url"

            git push --force aliyun HEAD:main || echo "❌ Push failed: $repo_name"

            cd ..
            rm -rf "$repo_name"
          done

      # =========================================================
      # 6️⃣ 更新 base 分支中的 plugins.json
      # =========================================================
      - name: Update plugins.json with ali_url
        if: ${{ steps.changed-plugins.outputs.changed_plugins != '' }}
        shell: python
        run: |
          import json

          with open("/tmp/changed_plugins.json", "r", encoding="utf-8") as f:
              changed = json.load(f)

          with open("plugins.json", "r", encoding="utf-8") as f:
              plugins = json.load(f)

          updated = False

          for c in changed:
              for p in plugins:
                  if p.get("github_url") == c["github_url"]:
                      p["ali_url"] = f"https://codeup.aliyun.com/67a361cf556e6cdab537117a/zhenxun_plugins/{c['repo_name']}"
                      updated = True

          if updated:
              with open("plugins.json", "w", encoding="utf-8") as f:
                  json.dump(plugins, f, ensure_ascii=False, indent=2)

      # =========================================================
      # 7️⃣ 提交到 base 分支
      # =========================================================
      - name: Commit and push changes
        if: ${{ success() && steps.changed-plugins.outputs.changed_plugins != '' }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add plugins.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync plugin to Aliyun Codeup"
            git push
          fi
