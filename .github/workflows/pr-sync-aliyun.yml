name: Sync plugins to Aliyun Codeup

on:
  pull_request:
    paths:
      - "plugins.json"

jobs:
  detect-and-sync:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出 PR 分支代码
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      # 2. 拉取 base 仓库对应分支
      - name: Fetch base branch
        run: |
          git remote add upstream https://github.com/${{ github.repository }}.git
          git fetch upstream ${{ github.base_ref }} --depth=1

      # 3. 检测插件变更
      - name: Identify changed plugins
        id: changed-plugins
        shell: python
        run: |
          import json
          import os
          import subprocess

          # 当前（PR 分支）的 plugins.json
          try:
              with open('plugins.json', 'r', encoding='utf-8') as f:
                  current_plugins = json.load(f)
          except FileNotFoundError:
              current_plugins = []
              print("::warning::plugins.json not found in PR branch")

          # 获取 base 分支的 plugins.json
          base_plugins = []
          try:
              result = subprocess.run(['git', 'show', f'upstream/${{ github.base_ref }}:plugins.json'], 
                                     capture_output=True, text=True, encoding='utf-8')
              if result.returncode == 0:
                  base_plugins = json.loads(result.stdout)
          except (FileNotFoundError, json.JSONDecodeError):
              print("::warning::Base plugins.json not found or invalid")

          # 变更检测
          changed = []
          base_map = {p.get('github_url'): p for p in base_plugins}
          for plugin in current_plugins:
              github_url = plugin.get('github_url')
              if not github_url:
                  continue
              base_plugin = base_map.get(github_url)
              if not base_plugin or json.dumps(plugin, sort_keys=True) != json.dumps(base_plugin, sort_keys=True):
                  repo_name = github_url.split('/')[-1]
                  if repo_name.endswith('.git'):
                      repo_name = repo_name[:-4]
                  changed.append({
                      'name': plugin.get('name', ''),
                      'github_url': github_url,
                      'repo_name': repo_name,
                      'description': plugin.get('description', ''),
                      'current_data': plugin
                  })
          if changed:
              json_str = json.dumps(changed, ensure_ascii=False)
              print(f"Changed plugins: {json_str}")
              # 写入文件供后续步骤使用
              with open('/tmp/changed_plugins.json', 'w', encoding='utf-8') as f:
                  f.write(json_str)
              # 同时写入 GitHub Actions output
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
                  f.write(f'changed_plugins={json_str}\n')
          else:
              print("No changed plugins found")

      # 4. 安装 Python 依赖
      - name: Install Python dependencies
        if: ${{ steps.changed-plugins.outputs.changed_plugins != '' }}
        run: |
          pip install requests

      # 5. 处理变更插件（创建阿里云仓库）
      - name: Create Aliyun repositories
        if: ${{ steps.changed-plugins.outputs.changed_plugins != '' }}
        id: create-repos
        run: |
          python scripts/sync.py \
            --changed-plugins '${{ steps.changed-plugins.outputs.changed_plugins }}' \
            --org-id '67a361cf556e6cdab537117a' \
            --access-token '${{ secrets.ALIYUN_PERSONAL_ACCESS_TOKEN }}' \
            --namespace-id 1638483 \
            --namespace-path 'zhenxun_plugins' \
            --visibility 'internal'

      # 6. 同步每个插件的代码到阿里云
      - name: Sync code for each plugin
        if: ${{ steps.changed-plugins.outputs.changed_plugins != '' }}
        run: |
          set -e

          # 读取JSON数据（文件已在步骤3中创建）
          changed_plugins=$(cat /tmp/changed_plugins.json)

          # 遍历每个插件
          for row in $(echo "${changed_plugins}" | jq -r '.[] | @base64'); do
            _jq() {
              echo ${row} | base64 --decode | jq -r ${1}
            }
            
            github_url=$(_jq '.github_url')
            repo_name=$(_jq '.repo_name')
            
            echo "🔄 开始同步插件: $repo_name"
            echo "GitHub URL: $github_url"
            
            # 克隆GitHub仓库
            echo "🔄 克隆GitHub仓库..."
            git clone "$github_url" "$repo_name"
            
            cd "$repo_name"
            
            # 配置Git
            echo "🔄 配置Git..."
            git config --global http.postBuffer 524288000
            git config --global core.compression 0
            
            # 添加阿里云远程
            echo "🔄 添加阿里云远程..."
            aliyun_url="https://${{ secrets.ALIYUN_ACCOUNT }}:${{ secrets.ALIYUN_PASSWORD }}@codeup.aliyun.com/67a361cf556e6cdab537117a/zhenxun_plugins/${repo_name}.git"
            git remote add aliyun "$aliyun_url"
            
            # 尝试推送
            echo "🔄 推送代码到阿里云..."
            if git push --progress --force aliyun HEAD:main; then
              echo "✅ 推送成功: $repo_name"
            else
              echo "❌ 推送失败: $repo_name"
            fi
            
            # 返回上级目录
            cd ..
            
            # 清理目录
            rm -rf "$repo_name"
            
            echo "✅ 完成同步: $repo_name"
            echo "---"
          done

      # 7. 更新 plugins.json 中的 ali_url
      - name: Update plugins.json with ali_url
        if: ${{ steps.changed-plugins.outputs.changed_plugins != '' }}
        shell: python
        run: |
          import json
          import os

          # 读取变更插件列表（文件已在步骤3中创建）
          with open('/tmp/changed_plugins.json', 'r', encoding='utf-8') as f:
              content = f.read().strip()
              print(f"读取到的内容: {content}")
              changed_plugins = json.loads(content)

          # 读取当前的plugins.json
          with open('plugins.json', 'r', encoding='utf-8') as f:
              plugins = json.load(f)

          updated = False

          # 更新ali_url
          for changed_plugin in changed_plugins:
              repo_name = changed_plugin['repo_name']
              ali_url = f"https://codeup.aliyun.com/67a361cf556e6cdab537117a/zhenxun_plugins/{repo_name}"
              
              # 在plugins.json中找到对应的插件
              for plugin in plugins:
                  if plugin.get('github_url') == changed_plugin['github_url']:
                      plugin['ali_url'] = ali_url
                      updated = True
                      print(f"✅ 更新 {plugin.get('name', repo_name)} 的 ali_url: {ali_url}")
                      break

          # 保存更新后的plugins.json
          if updated:
              with open('plugins.json', 'w', encoding='utf-8') as f:
                  json.dump(plugins, f, ensure_ascii=False, indent=2)
              print("✅ plugins.json 已更新")
          else:
              print("⚠️ 没有插件被更新")

      # 8. 提交变更
      - name: Commit and push changes
        if: ${{ success() && steps.changed-plugins.outputs.changed_plugins != '' }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add plugins.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add ali_url to plugins.json for Aliyun Codeup sync"
            git push
          fi
