name: Sync plugins to Aliyun Codeup

on:
  pull_request_target:
    paths:
      - "plugins.json"

jobs:
  detect-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify changed plugins
        id: changed-plugins
        shell: python
        run: |
          import json
          import os
          import urllib.request

          pr_repo_full = "${{ github.event.pull_request.head.repo.full_name }}"
          pr_ref = "${{ github.event.pull_request.head.ref }}"
          pr_url = f"https://raw.githubusercontent.com/{pr_repo_full}/{pr_ref}/plugins.json"

          try:
              with urllib.request.urlopen(pr_url, timeout=30) as resp:
                  pr_plugins = json.load(resp)
          except Exception as e:
              pr_plugins = []

          try:
              with open("plugins.json", "r", encoding="utf-8") as f:
                  base_plugins = json.load(f)
          except Exception as e:
              base_plugins = []

          base_map = {p.get("github_url"): p for p in base_plugins if p.get("github_url")}
          changed = []

          for plugin in pr_plugins:
              github_url = plugin.get("github_url")
              if not github_url:
                  continue
              base_plugin = base_map.get(github_url)
              if not base_plugin or plugin.get("name") != base_plugin.get("name") or plugin.get("version") != base_plugin.get("version"):
                  repo_name = github_url.rstrip("/").split("/")[-1].removesuffix(".git")
                  changed.append({
                      "name": plugin.get("name", ""),
                      "github_url": github_url,
                      "repo_name": repo_name,
                      "description": plugin.get("description", ""),
                  })

          out = json.dumps(changed, ensure_ascii=False)
          with open("/tmp/changed_plugins.json", "w", encoding="utf-8") as f:
              f.write(out)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"changed_plugins={out}\n")

      - name: Install Python dependencies
        if: ${{ steps.changed-plugins.outputs.changed_plugins != '' }}
        run: pip install requests

      - name: Create Aliyun repositories
        if: ${{ steps.changed-plugins.outputs.changed_plugins != '' }}
        run: |
          python scripts/sync.py \
            --changed-plugins '${{ steps.changed-plugins.outputs.changed_plugins }}' \
            --org-id '67a361cf556e6cdab537117a' \
            --access-token '${{ secrets.ALIYUN_PERSONAL_ACCESS_TOKEN }}' \
            --namespace-id 1638483 \
            --namespace-path 'zhenxun_plugins' \
            --visibility 'internal'

      - name: Sync code to Aliyun
        if: ${{ steps.changed-plugins.outputs.changed_plugins != '' }}
        run: |
          set +e
          changed_plugins=$(cat /tmp/changed_plugins.json)
          for row in $(echo "$changed_plugins" | jq -r '.[] | @base64'); do
            _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
            github_url=$(_jq '.github_url')
            github_url=$(echo "$github_url" | sed 's|/tree/.*||' | sed 's|/blob/.*||' | sed 's|/*$||')
            repo_name=$(echo "$github_url" | sed 's|.*/||' | sed 's|\.git$||')
            
            if [ -z "$repo_name" ]; then continue; fi

            if ! git clone "$github_url" "$repo_name"; then continue; fi
            cd "$repo_name"
            
            git config --global http.postBuffer 524288000
            git config --global core.compression 0
            aliyun_url="https://${{ secrets.ALIYUN_ACCOUNT }}:${{ secrets.ALIYUN_PASSWORD }}@codeup.aliyun.com/67a361cf556e6cdab537117a/zhenxun_plugins/${repo_name}.git"
            git remote add aliyun "$aliyun_url"
            git push --force aliyun HEAD:main
            
            cd ..
            rm -rf "$repo_name"
          done
