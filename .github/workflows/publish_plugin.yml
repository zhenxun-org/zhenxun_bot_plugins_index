name: plugin publish

on:
  issues:
    types: [opened, reopened, edited]
  pull_request_target:
    types: [closed]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    name: check
    # do not run on forked PRs, do not run on not related issues, do not run on pr comments
    if: |
      !(
        (
          github.event.pull_request &&
          (
            github.event.pull_request.head.repo.fork ||
            !(
              contains(github.event.pull_request.labels.*.name, 'Plugin')
            )
          )
        ) ||
        (
          github.event_name == 'issue_comment' && github.event.issue.pull_request
        )
      )
    steps:
      - run: echo "Check passed"
  
  reaction:
    runs-on: ubuntu-latest
    name: reaction
    needs: check
    if: |
      (
        github.event_name == 'issue_comment' &&
        github.event.action == 'created'
      ) ||
      (
        github.event_name == 'issues' &&
        github.event.action == 'opened'
      )
    steps:
      - name: Generate token
        id: generate-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_KEY }}

      - name: Reaction on issue
        if: github.event_name == 'issues'
        run: |
          gh api --method POST /repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/reactions -f "content=rocket"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Reaction on issue comment
        if: github.event_name == 'issue_comment'
        run: |
          gh api --method POST /repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions -f "content=rocket"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
  
  plugin_test:
    runs-on: ubuntu-latest
    name: zhenxun plugin test
    needs: check
    permissions:
      issues: read
    outputs:
      result: ${{ steps.plugin-test.outputs.RESULT }}
      output: ${{ steps.plugin-test.outputs.OUTPUT }}
      metadata: ${{ steps.plugin-test.outputs.METADATA }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        if: ${{ !startsWith(github.event_name, 'pull_request') }}
        run: pip install poetry

      # Poetry cache depends on OS, Python version and Poetry version.
      - name: Cache Poetry cache
        uses: actions/cache@v3
        if: ${{ !startsWith(github.event_name, 'pull_request') }}
        with:
          path: ~/.cache/pypoetry
          key: poetry-cache-${{ runner.os }}-${{ steps.setup_python.outputs.python-version }}

      - name: Setup zhenxun
        id: setup-zhenxun
        if: ${{ !startsWith(github.event_name, 'pull_request') }}
        run: |
          git clone -b main https://github.com/Hibikier/zhenxun_bot.git

      - name: Test Plugin
        id: plugin-test
        if: ${{ !startsWith(github.event_name, 'pull_request') }}
        run: |
          cd zhenxun_bot
          rm -rf ./zhenxun/plugins/* poetry.lock
          poetry source remove aliyun
          poetry install --no-root
          poetry run pip install pydantic==1.10
          curl -sSL https://github.com/zhenxun-org/zhenxunflow/releases/latest/download/plugin_test.py | poetry run python -

      - name: Test Plugin PR
        id: plugin-test-pr
        if: ${{ startsWith(github.event_name, 'pull_request') }}
        run: |
          curl -sSL https://github.com/zhenxun-org/zhenxunflow/releases/latest/download/plugin_test.py | python -
  
  zhenxunflow:
    runs-on: ubuntu-latest
    name: zhenxunflow
    needs: plugin_test
    outputs:
      run_id: ${{ steps.run_id.outputs.id }}
    steps:
      - name: 保存运行ID
        id: run_id
        run: echo "id=${{ github.run_id }}" >> $GITHUB_OUTPUT
      
      - name: Generate token
        id: generate-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0
          ref: index

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: .cache/.pre-commit
          key: zhenxunflow-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: zhenxunflow
        uses: docker://ghcr.io/zhenxun-org/zhenxunflow:latest
        with:
          config: >
            {
              "base": "index",
              "plugin_path": "plugins.json"
            }
        env:
          PLUGIN_TEST_RESULT: ${{ needs.plugin_test.outputs.result }}
          PLUGIN_TEST_OUTPUT: ${{ needs.plugin_test.outputs.output }}
          PLUGIN_TEST_METADATA: ${{ needs.plugin_test.outputs.metadata }}
          APP_ID: ${{ secrets.APP_ID }}
          PRIVATE_KEY: ${{ secrets.APP_KEY }}
          PRE_COMMIT_HOME: /github/workspace/.cache/.pre-commit

      - name: Fix permission
        run: sudo chown -R $(whoami):$(id -ng) .cache/.pre-commit
      
      # 上传生成的插件数据
      - name: 上传插件数据
        uses: actions/upload-artifact@v4
        with:
          name: zhenxunflow-artifacts
          path: plugins.json
          retention-days: 1
  
  update_table:
    runs-on: ubuntu-latest
    needs: zhenxunflow
    name: 更新插件索引表格
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: index
      
      # 下载插件数据
      - name: 下载插件数据
        uses: actions/download-artifact@v4
        with:
          name: zhenxunflow-artifacts
          path: .
      
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: 生成插件索引表格
        run: |
          # 运行脚本并捕获退出码
          python update_table.py || exit_code=$?
          if [ $exit_code -eq 78 ]; then
            echo "ℹ️ 插件索引表格没有变化"
            echo "no_changes=true" >> $GITHUB_ENV
          elif [ $exit_code -ne 0 ]; then
            echo "❌ 脚本执行失败，退出码: $exit_code"
            exit $exit_code
          fi
          echo "=== 生成的索引文件预览 ==="
          cat indices/Plugin-list.md
      
      - name: 创建更新分支
        if: ${{ env.no_changes != 'true' }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git pull origin index
          git checkout -b update-plugin-table-${{ github.run_id }}
          git add indices/Plugin-list.md
          git commit -m "自动更新插件索引表格 [skip ci]"
          git push origin HEAD
      
      # 关键修复：配置 create-pull-request 动作
      - name: 创建或更新PR
        if: ${{ env.no_changes != 'true' }}
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "自动更新插件索引表格"
          body: "由GitHub Actions自动生成的插件索引更新"
          base: index
          branch: update-plugin-table-${{ github.run_id }}
          delete-branch: true
          labels: automated
          # 关键配置：禁用自动提交
          commit: false
          # 关键配置：设置正确的作者信息
          author: "GitHub Action <action@github.com>"
          committer: "GitHub Action <action@github.com>"
      
      - name: 无更改通知
        if: ${{ env.no_changes == 'true' }}
        run: echo "✅ 插件索引表格没有变化，无需更新"