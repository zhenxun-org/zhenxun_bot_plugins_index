name: plugin publish

on:
  issues:
    types: [opened, reopened, edited]
  pull_request_target:
    types: [closed]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    name: check
    if: |
      !(
        (
          github.event.pull_request &&
          (
            github.event.pull_request.head.repo.fork ||
            !(
              contains(github.event.pull_request.labels.*.name, 'Plugin')
            )
          )
        ) ||
        (
          github.event_name == 'issue_comment' && github.event.issue.pull_request
        )
      )
    steps:
      - run: echo "Check passed"

  reaction:
    runs-on: ubuntu-latest
    name: reaction
    needs: check
    if: |
      (
        github.event_name == 'issue_comment' &&
        github.event.action == 'created'
      ) ||
      (
        github.event_name == 'issues' &&
        github.event.action == 'opened'
      )
    steps:
      - name: Generate token
        id: generate-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_KEY }}

      - name: Reaction on issue
        if: github.event_name == 'issues'
        run: |
          gh api --method POST /repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/reactions -f "content=rocket"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Reaction on issue comment
        if: github.event_name == 'issue_comment'
        run: |
          gh api --method POST /repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions -f "content=rocket"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

  ensure_plugin_label:
    runs-on: ubuntu-latest
    name: ensure plugin label
    needs: check
    if: |
      github.event_name == 'issues' ||
      github.event_name == 'issue_comment'
    permissions:
      issues: write
    steps:
      - name: Generate token
        id: generate-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_KEY }}

      - name: Ensure Plugin label exists and attach it
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -e
          if ! gh label list --repo "${{ github.repository }}" --limit 200 | awk '{print $1}' | grep -qx "Plugin"; then
            gh label create "Plugin" \
              --repo "${{ github.repository }}" \
              --color "0366d6" \
              --description "Plugin publication request" \
              --force
          fi
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "Plugin"

  plugin_test:
    runs-on: ubuntu-latest
    name: zhenxun plugin test
    needs: check
    if: |
      github.event_name == 'issues' ||
      github.event_name == 'issue_comment'
    permissions:
      issues: read
    outputs:
      result: ${{ steps.plugin-test.outputs.RESULT }}
      output: ${{ steps.plugin-test.outputs.OUTPUT }}
      metadata: ${{ steps.plugin-test.outputs.METADATA }}
    steps:
      - uses: actions/checkout@v4

      # ================== 新增步骤：安装系统依赖 ==================
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0
      # =========================================================

      # 1. 先 Clone 真寻，确保目录下有 pyproject.toml
      - name: Setup zhenxun
        id: setup-zhenxun
        run: |
          git clone --depth 1 -b main https://github.com/zhenxun-org/zhenxun_bot.git

      # 2. 此时有了真寻目录，再安装 uv 并配置缓存路径
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # 缓存哈希指向真寻目录下的配置文件
          cache-dependency-glob: "zhenxun_bot/pyproject.toml"

      - name: Setup Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Test Plugin
        id: plugin-test
        run: |
          set -o pipefail
          cd zhenxun_bot
          
          # 清理旧插件和 lock
          rm -rf ./zhenxun/plugins/* uv.lock
          
          # 移除 aliyun 源
          if grep -q "aliyun" pyproject.toml; then
            sed -i '/\[\[tool.uv.index\]\]/,/url = ".*aliyun.*"/d' pyproject.toml
          fi

          # uv 操作
          uv sync --no-dev
          uv pip install --upgrade "pydantic>=2"
          
          uv run python - <<'PY'
          import pydantic
          import fastapi
          print("pydantic:", pydantic.__version__)
          print("fastapi:", fastapi.__version__)
          PY
          
          curl --fail --silent --show-error --location \
            https://github.com/zhenxun-org/zhenxunflow/releases/latest/download/plugin_test.py \
            | uv run python -
  
  zhenxunflow:
    runs-on: ubuntu-latest
    name: zhenxunflow
    needs: [check, plugin_test, ensure_plugin_label]
    if: |
      always() &&
      needs.check.result == 'success' &&
      (
        (
          (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
          needs.plugin_test.result == 'success' &&
          needs.ensure_plugin_label.result == 'success'
        ) ||
        github.event_name == 'pull_request_review' ||
        github.event_name == 'pull_request_target'
      )
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Generate token
        id: generate-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Cache pre-commit hooks
        id: cache-pre-commit
        uses: actions/cache@v4
        with:
          path: .cache/.pre-commit
          key: zhenxunflow-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: zhenxunflow
        uses: docker://ghcr.io/zhenxun-org/zhenxunflow:latest
        with:
          config: >
            {
              "base": "index",
              "plugin_path": "plugins.json"
            }
        env:
          PLUGIN_TEST_RESULT: ${{ needs.plugin_test.outputs.result }}
          PLUGIN_TEST_OUTPUT: ${{ needs.plugin_test.outputs.output }}
          PLUGIN_TEST_METADATA: ${{ needs.plugin_test.outputs.metadata }}
          APP_ID: ${{ secrets.APP_ID }}
          PRIVATE_KEY: ${{ secrets.APP_KEY }}
          PRE_COMMIT_HOME: /github/workspace/.cache/.pre-commit

      - name: Fix permission
        if: always()
        run: |
          if [ -d .cache/.pre-commit ]; then
            sudo chown -R $(whoami):$(id -ng) .cache/.pre-commit
          fi
