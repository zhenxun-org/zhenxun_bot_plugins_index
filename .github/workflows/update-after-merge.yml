name: Update JSON and README After Merge

on:
  push:
    branches:
      - "index"  # 请确保这里是你当前测试用的主分支名 (如 main 或 index)
    paths:
      - "plugins.json"

permissions:
  contents: write

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 关键修改：必须拉取至少 2 个历史提交，以便能够对比 HEAD^1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Auto generate missing ali_url for CHANGED plugins
        shell: python
        run: |
          import json
          import subprocess
          
          # 1. 加载当前合并后的最新 plugins.json
          with open("plugins.json", "r", encoding="utf-8") as f:
              current_plugins = json.load(f)

          # 2. 通过 Git 命令读取合并前（HEAD^1）的 plugins.json
          try:
              old_json_str = subprocess.check_output(["git", "show", "HEAD^1:plugins.json"]).decode("utf-8")
              old_plugins = json.loads(old_json_str)
          except Exception as e:
              print(f"⚠️ 无法读取上一个版本，可能是初次提交: {e}")
              old_plugins = []

          old_map = {p.get("github_url"): p for p in old_plugins if p.get("github_url")}
          updated = False

          # 3. 遍历当前插件，找出本次用户提交的插件
          for p in current_plugins:
              github_url = p.get("github_url")
              if not github_url:
                  continue
                  
              old_p = old_map.get(github_url)
              
              # 判断核心：只抓取本次“新增的”或“修改了版本号/名字的”插件
              is_just_updated = (not old_p) or (p.get("version") != old_p.get("version")) or (p.get("name") != old_p.get("name"))

              # 只有当它是本次更新的插件，且没有 ali_url 时，才补全
              if is_just_updated and not p.get("ali_url"):
                  repo_name = github_url.split('/tree/')[0].split('/blob/')[0].rstrip('/').split('/')[-1].replace('.git', '')
                  # 请确保这里的组织 ID 和路径是你自己的
                  p["ali_url"] = f"https://codeup.aliyun.com/67a361cf556e6cdab537117a/zhenxun-org/zhenxun_plugins/{repo_name}"
                  updated = True
                  print(f"✅ 检测到本次修改的插件，已生成 ali_url: {p.get('name', repo_name)}")

          # 4. 如果有更新，保存文件
          if updated:
              with open("plugins.json", "w", encoding="utf-8") as f:
                  json.dump(current_plugins, f, ensure_ascii=False, indent=2)
          else:
              print("ℹ️ 本次提交没有需要补全 ali_url 的新插件。")

      - name: Update README table
        run: |
          python scripts/update_readme_table.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add plugins.json
          
          if git diff --staged --quiet; then
            echo "✅ 没有发现变动，跳过提交。"
          else
            git commit -m "chore: 自动补全 ali_url [skip ci]"
            git push
            echo "✅ 成功更新并推送。"
          fi
