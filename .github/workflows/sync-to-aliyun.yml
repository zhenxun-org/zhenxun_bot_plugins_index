name: Force Sync to Aliyun

on:
  workflow_run:
    workflows: ["Update JSON and README After Merge"]
    types: [completed]

jobs:
  sync:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'index' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config --global core.compression 0
          echo "Current HEAD: $(git rev-parse HEAD)"

      - name: Add aliyun remote
        run: |
          git remote remove aliyun 2>/dev/null || true
          git remote add aliyun https://${{secrets.ALIYUN_ACCOUNT}}:${{secrets.ALIYUN_PASSWORD}}@codeup.aliyun.com/67a361cf556e6cdab537117a/zhenxun-org/zhenxun_bot_plugins_index.git
          echo "Target remote: https://${{secrets.ALIYUN_ACCOUNT}}@codeup.aliyun.com/67a361cf556e6cdab537117a/zhenxun-org/zhenxun_bot_plugins_index.git"
          git fetch aliyun index --force
          echo "Remote HEAD on Codeup: $(git ls-remote --heads aliyun index | awk '{print $1}')"

      - name: Skip if already synced
        run: |
          CURRENT=$(git rev-parse HEAD)
          REMOTE=$(git ls-remote --heads aliyun index | awk '{print $1}')
          if [ -n "$REMOTE" ] && [ "$REMOTE" = "$CURRENT" ]; then
            echo "✅ 当前 commit 已在阿里云目标分支上，跳过重复 push"
            exit 0
          fi

      - name: Force push
        run: |
          echo "Pushing HEAD $(git rev-parse HEAD) to aliyun index"
          git push --progress --force aliyun HEAD:index
