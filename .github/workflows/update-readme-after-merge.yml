name: Update README after PR merge

on:
  push:
    branches:
      - "index"
    paths:
      - "plugins.json"
      - ".pr-need-readme-update"

jobs:
  update-readme:
    if: ${{ !contains(github.event.head_commit.message, '自动补全 ali_url') && !contains(github.event.head_commit.message, '自动更新 README.md 中的插件列表表格') }}
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      # 3. 运行更新脚本
      - name: Update README table
        run: |
          python scripts/update_readme_table.py
      
      # 4. 检查是否有更改
      - name: Check for changes
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
      
      # 5. 提交更改（如果有）
      - name: Commit and push changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          # 配置 Git 用户
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 添加 README.md 和删除标记文件
          git add README.md
          git rm -f .pr-need-readme-update 2>/dev/null || true  # 删除标记文件（如果存在）
          git rm -f readme_update_instructions.txt 2>/dev/null || true  # 删除说明文件（如果存在）
          
          # 提交更改
          git commit -m "chore: 自动更新 README.md 中的插件列表表格 [skip ci]" || exit 0
          
          # 推送更改
          git push
      
      # 6. 发布更新通知
      - name: Notify about the update
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log("README.md has been updated successfully after PR merge");