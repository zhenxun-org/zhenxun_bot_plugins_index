name: Update README Plugin Table

on:
  pull_request:
    paths:
      - "plugins.json"

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出 PR 分支代码
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          persist-credentials: true
      
      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      # 3. 运行更新脚本
      - name: Update README table
        run: |
          python scripts/update_readme_table.py
      
      # 4. 检查是否有更改
      - name: Check for changes
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "README needs update" > .pr-need-readme-update
            echo "needs_update_file=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "needs_update_file=false" >> $GITHUB_OUTPUT
          fi
      
      # 5. 尝试提交更改（仅当PR来自同源仓库时）
      - name: Commit and push changes if same repo
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.check-changes.outputs.has_changes == 'true'
        run: |
          # 配置 Git 用户
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 添加和提交更改
          git add README.md
          git commit -m "chore: 自动更新 README.md 中的插件列表表格 [skip ci]"
          
          # 推送更改
          git push
      
      # 6. 对于fork仓库和有变化的情况，添加标记文件
      - name: Add marker file for fork PRs with changes
        if: github.event.pull_request.head.repo.full_name != github.repository && steps.check-changes.outputs.needs_update_file == 'true'
        run: |
          # 添加标记文件，提醒维护者合并后需要更新README
          git add .pr-need-readme-update
          echo "需要在合并后更新README.md" > readme_update_instructions.txt
          git add readme_update_instructions.txt
          
          # 由于是fork，无法直接推送，但我们可以准备提交信息
          echo "Fork PR detected, cannot commit automatically, but README would need update"
      
      # 7. 上传需要更新的文件作为工件
      - name: Upload marker files
        if: steps.check-changes.outputs.needs_update_file == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: readme-needs-update-marker
          path: |
            .pr-need-readme-update
            readme_update_instructions.txt
      
      # 8. 添加评论到PR（适用于所有情况）
      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          HAS_CHANGES: ${{ steps.check-changes.outputs.has_changes }}
          REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const hasChanges = process.env.HAS_CHANGES === 'true';
            const repoFullName = process.env.REPO_FULL_NAME;
            const githubRepository = process.env.GITHUB_REPOSITORY;
            
            let commentBody = '';
            
            if (hasChanges) {
              if (repoFullName === githubRepository) {
                commentBody = '✅ 已自动更新 README.md 中的插件列表表格';
              } else {
                commentBody = '📋 检测到插件信息更新，README.md 需要更新，但 PR 来自 fork 仓库，无法自动提交更改。\n\n✅ **重要提醒：合并 PR 后，README.md 需要手动更新**。系统已准备了更新标记文件。';
              }
            } else {
              commentBody = 'ℹ️ 插件信息没有变化，无需更新 README.md 表格';
            }
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });