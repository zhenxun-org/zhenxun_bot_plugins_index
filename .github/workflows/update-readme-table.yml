name: Update README Plugin Table

on:
  pull_request:
    paths:
      - "plugins.json"

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    
    steps:
      # 1. 检出 PR 分支代码
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.ACCESS_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      
      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      # 3. 运行更新脚本
      - name: Update README table
        run: |
          python scripts/update_readme_table.py
      
      # 4. 检查是否有更改
      - name: Check for changes
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
      
      # 5. 提交更改（如果有）
      - name: Commit and push changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          # 配置 Git 用户
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 添加和提交更改
          git add README.md
          git commit -m "chore: 自动更新 README.md 中的插件列表表格 [skip ci]"
          
          # 使用明确的 PAT 认证 URL 推送
          # 注意：这里的 ${{ github.event.pull_request.head.repo.full_name }} 可能是 fork 仓库
          git push https://x-access-token:${{ secrets.ACCESS_TOKEN }}@github.com/${{ github.event.pull_request.head.repo.full_name }}.git HEAD:${{ github.event.pull_request.head.ref }}
          
          # 或者如果上面不行，尝试使用更简化的方式：
          # git push origin HEAD:${{ github.event.pull_request.head.ref }}
      
      # 6. 添加评论（如果有更改）
      - name: Comment on PR
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ACCESS_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ 已自动更新 README.md 中的插件列表表格'
            })